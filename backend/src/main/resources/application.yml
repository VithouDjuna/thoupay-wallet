spring:
  application:
    name: thoupay-wallet
  mvc:
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    validate-migration-naming: true
    locations:
      - db/migration
    clean-disabled: true
    enabled: true
  datasource:
    username: ${PG_USER}
    password: ${PG_PASSWORD}
    url: ${PG_URL}
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info