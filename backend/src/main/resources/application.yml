spring:
  application:
    name: thoupay-wallet
  mvc:
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    validate-migration-naming: true
    locations:
      - db/migration
  datasource:
    username: admin
    password: admin
    url: jdbc:postgresql://localhost:5432/postgres
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info